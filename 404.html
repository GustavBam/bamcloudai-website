    .btn-secondary { background: transparent; color: var(--white); border: 1.5px solid rgba(255,255,255,0.55); }

    .links { font-size: 0.88rem; color: rgba(255,255,255,0.65); }
    .links a { color: var(--azure-light); text-decoration: none; }

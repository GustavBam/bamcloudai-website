<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Bam Cloud AI — Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  body { margin: 0; padding: 40px; background: #1a1a2e; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 48px; }
  h3 { color: rgba(255,255,255,0.4); font-weight: 400; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin: 0 0 12px; text-align: center; }

  /* Standard business card: 85mm × 54mm at 96dpi ≈ 322px × 204px — shown at 2× for screen */
  .card { width: 644px; height: 408px; border-radius: 16px; position: relative; overflow: hidden; flex-shrink: 0; }

  /* ── FRONT ── */
  .card-front { background: #0F1B2D; }

  .card-front .bg-grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(0,120,212,0.12) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  .card-front .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 36px 44px;
  }

  .node-accent {
    position: absolute; top: -30px; right: -30px;
    opacity: 0.18;
  }

  /* ── BACK ── */
  .card-back { background: #0A1628; }
  .card-back .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: linear-gradient(to bottom, #00D4FF, #A855F7, #FF6B35, #00FF88, #FF3CAC, #FFD700); }
  .card-back .content {
    position: absolute; inset: 0; left: 10px;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 36px 44px;
    gap: 14px;
  }

  .contact-row { display: flex; align-items: center; gap: 14px; }
  .contact-icon { width: 18px; text-align: center; }
  .contact-icon svg { display: block; }
  .contact-text { font-size: 15px; color: rgba(255,255,255,0.85); font-weight: 400; }
  .contact-text.highlight { color: #50A0DC; }

  .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 4px 0; }
</style>
</head>
<body>

<div>
  <h3>Front</h3>
  <div class="card card-front">
    <div class="bg-grid"></div>

    <!-- large faded node mark background accent -->
    <svg class="node-accent" viewBox="0 0 220 220" width="220" height="220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="110" y1="20"  x2="110" y2="68"  stroke="#00D4FF" stroke-width="4" stroke-linecap="round"/>
      <line x1="171" y1="55"  x2="136" y2="78"  stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
      <line x1="171" y1="165" x2="136" y2="142" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
      <line x1="110" y1="200" x2="110" y2="152" stroke="#00FF88" stroke-width="4" stroke-linecap="round"/>
      <line x1="49"  y1="165" x2="84"  y2="142" stroke="#FF3CAC" stroke-width="4" stroke-linecap="round"/>
      <line x1="49"  y1="55"  x2="84"  y2="78"  stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
      <circle cx="110" cy="14"  r="14" fill="#00D4FF"/>
      <circle cx="175" cy="50"  r="14" fill="#A855F7"/>
      <circle cx="175" cy="170" r="14" fill="#FF6B35"/>
      <circle cx="110" cy="206" r="14" fill="#00FF88"/>
      <circle cx="45"  cy="170" r="14" fill="#FF3CAC"/>
      <circle cx="45"  cy="50"  r="14" fill="#FFD700"/>
      <circle cx="110" cy="110" r="24" fill="#0078D4"/>
      <circle cx="110" cy="110" r="13" fill="white"/>
    </svg>

    <div class="content">
      <!-- Top: logo -->
      <div style="display:flex; align-items:center; gap:16px;">
        <svg viewBox="0 0 80 80" width="52" height="52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="40" y1="10" x2="40" y2="27" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="63" y1="23" x2="52" y2="32" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="63" y1="57" x2="52" y2="48" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="40" y1="70" x2="40" y2="53" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="17" y1="57" x2="28" y2="48" stroke="#FF3CAC" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="17" y1="23" x2="28" y2="32" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="40" cy="7"  r="7" fill="#00D4FF"/>
          <circle cx="65" cy="22" r="7" fill="#A855F7"/>
          <circle cx="65" cy="58" r="7" fill="#FF6B35"/>
          <circle cx="40" cy="73" r="7" fill="#00FF88"/>
          <circle cx="15" cy="58" r="7" fill="#FF3CAC"/>
          <circle cx="15" cy="22" r="7" fill="#FFD700"/>
          <circle cx="40" cy="40" r="12" fill="#0078D4"/>
          <circle cx="40" cy="40" r="6.5" fill="white"/>
        </svg>
        <div>
          <div style="font-size:22px; font-weight:800; color:#E8621A; letter-spacing:-0.5px; line-height:1;">BAM <span style="font-weight:300; color:#FFFFFF;">Cloud AI</span></div>
          <div style="font-size:9.5px; letter-spacing:1.8px; margin-top:4px; font-weight:500;"><span style="color:#E8621A;">B</span><span style="color:rgba(255,255,255,0.8);">UILD</span> · <span style="color:#E8621A;">A</span><span style="color:rgba(255,255,255,0.8);">RCHITECT</span> · <span style="color:#E8621A;">M</span><span style="color:rgba(255,255,255,0.8);">ASTER</span></div>
        </div>
      </div>

      <!-- Bottom: name + title -->
      <div>
        <div style="font-size:24px; font-weight:700; color:#fff; letter-spacing:-0.5px; margin-bottom:6px;">Gustav Bam</div>
        <div style="font-size:13px; color:#50A0DC; font-weight:400; letter-spacing:0.3px; margin-bottom:2px;">Azure Solutions Architect Expert · Microsoft Certified Trainer</div>
        <div style="font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:0.2px;">AZ-305 · AZ-104 · MCT · MCSE</div>
      </div>
    </div>
  </div>
</div>

<div>
  <h3>Back</h3>
  <div class="card card-back">
    <div class="stripe"></div>
    <div class="content">

      <div class="contact-row">
        <div class="contact-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#50A0DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
        </div>
        <span class="contact-text highlight">gustav@bamcloudai.com</span>
      </div>

      <div class="contact-row">
        <div class="contact-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#50A0DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <span class="contact-text highlight">bamcloudai.com</span>
      </div>

      <div class="divider"></div>

      <div class="contact-row">
        <div class="contact-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <span class="contact-text" style="color:rgba(255,255,255,0.5);">Durbanville, Cape Town · South Africa</span>
      </div>

      <div class="contact-row">
        <div class="contact-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        </div>
        <span class="contact-text" style="color:rgba(255,255,255,0.5);">Azure Training · Cloud Consulting · Business English for IT</span>
      </div>

      <div class="divider"></div>

      <!-- colour node mini strip bottom right -->
      <div style="display:flex; gap:6px; justify-content:flex-end; margin-top:4px;">
        <div style="width:8px; height:8px; border-radius:50%; background:#00D4FF;"></div>
        <div style="width:8px; height:8px; border-radius:50%; background:#A855F7;"></div>
        <div style="width:8px; height:8px; border-radius:50%; background:#FF6B35;"></div>
        <div style="width:8px; height:8px; border-radius:50%; background:#00FF88;"></div>
        <div style="width:8px; height:8px; border-radius:50%; background:#FF3CAC;"></div>
        <div style="width:8px; height:8px; border-radius:50%; background:#FFD700;"></div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
